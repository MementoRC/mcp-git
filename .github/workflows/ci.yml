name: CI

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]
  workflow_dispatch:

jobs:
  # Core CI via ci-framework reusable workflow
  ci:
    uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-ci.yml@v2.5.1
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      actions: read
      checks: write
    with:
      pixi-environment: "ci"
      python-versions: '["3.12"]'
      os-matrix: '["ubuntu-latest"]'
      enable-performance: false
      enable-hygiene-check: true
      editable-install: true
      package-path: "."
      allowed-licenses: "MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, PSF-2.0, LGPL-3.0"
    secrets: inherit

  # Enforce main/master only accepts PRs from development
  branch-policy:
    name: "Branch Policy"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'master')
    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "development" ]; then
            echo "PRs to main/master must come from development branch"
            echo "   Source: ${{ github.head_ref }}"
            echo "   Expected: development"
            exit 1
          fi
          echo "PR from development to main/master - allowed"

  # Gate job for branch protection
  ci-success:
    name: "CI Success"
    runs-on: ubuntu-latest
    needs: [ci]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"

  # Custom: MCP Server Behavior Validation (not in ci-framework)
  mcp-validation:
    name: MCP Server Behavior Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ci]
    continue-on-error: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.9.0
      with:
        pixi-version: v0.49.0
        cache: false
        manifest-path: pyproject.toml

    - name: Install dependencies
      run: pixi install -e ci

    - name: Configure Git for MCP testing
      run: |
        git config --global user.name "MCP Validator"
        git config --global user.email "mcp-validator@example.com"
        git config --global init.defaultBranch main

    - name: Create test repository for MCP validation
      run: |
        mkdir -p /tmp/mcp-test-repo
        cd /tmp/mcp-test-repo
        git init
        echo "# Test Repository" > README.md
        git add README.md
        git commit -m "Initial commit"
        echo "Test content" > test.txt
        git add test.txt
        git commit -m "Add test file"

    - name: Test MCP server startup and basic functionality
      run: |
        if timeout 10s pixi run -e ci pixi-git-server --test-mode; then
          echo "MCP server startup test completed successfully"
        else
          SERVER_EXIT_CODE=$?
          echo "MCP server test failed with exit code: $SERVER_EXIT_CODE"
          exit 1
        fi

    - name: Validate MCP protocol compliance
      run: |
        pip install mcp-inspector 2>/dev/null || true
        cat > mcp_validate.py << 'EOF'
        import subprocess
        import sys

        def validate_mcp_server():
            print("Starting MCP server behavior validation...")
            try:
                result = subprocess.run([
                    "pixi", "run", "-e", "ci", "mcp-server-git", "--help"
                ], capture_output=True, text=True, timeout=10)
                if result.returncode == 0:
                    print("Server help command works")
                else:
                    print(f"Server help failed: {result.stderr}")
                    return False
            except subprocess.TimeoutExpired:
                print("Server help command timed out")
                return False
            except Exception as e:
                print(f"Server help command failed: {e}")
                return False

            try:
                from mcp_server_git.models.notifications import ClientNotification
                print("Notification models are importable")
            except ImportError as e:
                print(f"Cannot import notification models: {e}")
                return False

            try:
                import mcp_server_git.applications.server_application
                print("Server module structure is valid")
            except ImportError as e:
                print(f"Server module import failed: {e}")
                return False

            print("All MCP server behavior validations passed!")
            return True

        if __name__ == "__main__":
            success = validate_mcp_server()
            sys.exit(0 if success else 1)
        EOF
        cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE/src:$PYTHONPATH" pixi run -e ci python mcp_validate.py

  # Custom: Docker Build Validation (not in ci-framework)
  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ci]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          network=host

    - name: Build Docker image
      run: |
        docker build \
          --progress=plain \
          --no-cache=false \
          -t mcp-server-git:test .

    - name: Test Docker image
      run: docker run --rm mcp-server-git:test --help

    - name: Validate Docker image structure
      run: |
        docker run --rm --entrypoint python mcp-server-git:test -c "import mcp_server_git; print('Package installed correctly')"

  # Custom: Performance & Load Testing (not in ci-framework)
  performance:
    name: Performance & Load Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [mcp-validation]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.9.0
      with:
        pixi-version: v0.49.0
        cache: false
        manifest-path: pyproject.toml

    - name: Install dependencies
      run: pixi install -e ci

    - name: Configure Git for performance testing
      run: |
        git config --global user.name "Perf Tester"
        git config --global user.email "perf-test@example.com"

    - name: Run performance tests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p /tmp/perf-test-repo
        cd /tmp/perf-test-repo
        git init
        for i in {1..50}; do
          echo "Content $i" > "file_$i.txt"
          git add "file_$i.txt"
          git commit -m "Add file $i"
        done
        git checkout -b feature/test-1
        echo "Feature content" > feature.txt
        git add feature.txt
        git commit -m "Add feature"
        cd "$GITHUB_WORKSPACE"
        pixi run -e ci pytest tests/ -k "not slow" -m "not ci_skip" --ignore=tests/test_e2e_server.py --ignore=tests/test_llm_compliant_server_e2e.py --tb=short -v --timeout=600
