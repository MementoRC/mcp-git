[project]
name = "mcp-server-git"
version = "0.6.3"
description = "A Model Context Protocol server providing tools to read, search, and manipulate Git repositories programmatically via LLMs"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Anthropic, PBC." }]
maintainers = [{ name = "Memento 'RC' Mori" }]
keywords = ["git", "mcp", "llm", "automation"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core dependencies now managed by pixi
]

# Dependencies now managed by pixi tiered features

[project.scripts]
mcp-server-git = "mcp_server_git:main"
mcp-git-lean = "mcp_server_git.lean:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-git"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server that provides comprehensive Git repository management and GitHub integration capabilities for AI-powered development tools"
authors = [{name = "Claude Sonnet 3.5", email = "claude@anthropic.com"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.8.0",
    "click>=8.1.7",
    "gitpython>=3.1.43",
    "mcp>=1.11.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/MementoRC/mcp-git"
Repository = "https://github.com/MementoRC/mcp-git.git"
Documentation = "https://github.com/MementoRC/mcp-git#readme"

# =============================================================================
# TOOL CONFIGURATION
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Tests"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
timeout = 30
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: marks tests as end-to-end tests (deselect with '-m \"not e2e\"')",
    "ci_skip: marks tests to skip in CI environment",
    "mcp_verification: tests that replicate manual MCP verification process",
    "phase1: basic git operations (status, log, diff)",
    "phase2: GitHub API operations (list PRs, get details, status)",
    "phase3: advanced git operations (show, security validation)",
    "phase4: error handling and edge cases",
    "requires_github_token: tests that require GitHub API access"
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["F", "E9", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F821", "F401", "F841"]
# TDD type tests: Allow undefined names and unused imports during red phase
"tests/unit/types/*.py" = ["F821", "F401", "F841"]
# Types module: Allow F403 star imports in __init__.py for re-exporting architectural pattern
"src/mcp_server_git/types/__init__.py" = ["F403"]
# Ensure other type files maintain strict standards
"src/mcp_server_git/types/[!_]*.py" = []

[tool.ruff.format]
# Ensure consistent formatting across ruff versions
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.vulture]
# Vulture configuration for dead code detection
min_confidence = 80
paths = ["src/"]
exclude = ["tests/", "docs/", "examples/"]
ignore_decorators = ["@app.route", "@click.command", "@click.option"]
ignore_names = ["__all__", "__version__", "__author__"]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]  # CI-optimized: single platform for reliability - PR #74 CI fix

[tool.pixi.dependencies]
# Core runtime dependencies
python = ">=3.12"
aiohttp = ">=3.8.0"
click = ">=8.1.7"
gitpython = ">=3.1.43"
jsonschema = ">=4.17.0"
mcp = ">=1.11.0"
fastmcp = ">=2.11.3,<3"
psutil = ">=5.9.0"
pydantic = ">=2.0.0"
python-dotenv = ">=1.0.0"
lupa = ">=2.6,<3"
httpx = ">=0.24.0"

[tool.pixi.feature.quality.dependencies]
# QA dependencies - used in quality environment
ruff = ">=0.8.4"
mypy = ">=1.7.1"
pytest = ">=8.0.0"
pytest-asyncio = ">=0.24.0"
pytest-timeout = ">=2.3.1"
pytest-mock = ">=3.14.0"
pyright = ">=1.1.0"
nodejs = ">=20"  # Required for pyright

# TIER 2: Extended Quality & Security
[tool.pixi.feature.quality-extended.dependencies]
# Security Scanning
bandit = ">=1.7.5"
safety = ">=3.0.0"

# Code Quality Analysis
hypothesis = ">=6.0.0"

# Dead Code Detection
vulture = ">=2.0"

# Git Hooks
pre-commit = ">=3.0.0"

# TIER 3: CI/CD & Build
[tool.pixi.feature.quality-ci.dependencies]
# CI Reporting
coverage = ">=7.0.0"
pytest-json-report = ">=1.5.0"
pytest-html = ">=4.0.0"

# Build Tools (conda-forge versions)
twine = ">=4.0.0"

# CI-specific dependencies - Fixes missing CI environment for PR #74
[tool.pixi.feature.ci.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.24.0"
pytest-timeout = ">=2.3.1"
pytest-mock = ">=3.14.0"
pytest-cov = ">=4.0.0"
coverage = ">=7.0.0"

# ===== DEVELOPMENT FEATURES =====
# Keep existing dev feature for specialized tools
[tool.pixi.feature.dev-specialized.dependencies]
# Development tools not needed for CI
memory_profiler = "*"
pytest-benchmark = "*"
pytest-aiohttp = ">=1.0.0"
pytest-metadata = ">=3.0.0"
faker = "*"

[tool.pixi.environments]
default = { solve-group = "main" }
quality = { features = ["quality"], solve-group = "main" }
quality-extended = { features = ["quality", "quality-extended"], solve-group = "extended" }
ci = { features = ["quality", "ci"], solve-group = "main" }

# =============================================================================
# PIXI TASKS CONFIGURATION
# =============================================================================

[tool.pixi.tasks]

# ===== TIER 0: DEVELOPMENT TASKS =====
install = "pip install -e ."
dev = "python -m mcp_server_git"

# ===== TIER 1: CORE QUALITY TASKS =====
# Basic Code Quality
test = "pytest"
test-coverage = "pytest --cov=src/mcp_server_git --cov-report=term-missing"
test-unit = "pytest tests/unit/ -v"
test-e2e = "pytest tests/e2e/ -v -m 'not ci_skip'"
test-phase1 = "pytest -m phase1 -v"
test-phase2 = "pytest -m phase2 -v"
test-phase3 = "pytest -m phase3 -v"
test-phase4 = "pytest -m phase4 -v"

# Essential Linting (CI-focused)
lint = "ruff check src/ tests/ --select=F,E9"
lint-fix = "ruff check src/ tests/ --select=F,E9 --fix"
format = "ruff format src/ tests/"
format-check = "ruff format src/ tests/ --check"

# Type Checking
typecheck = "mypy src/mcp_server_git --ignore-missing-imports"

# Combined Quality Gate (CI Entry Point)
quality = { depends-on = ["test", "lint", "format-check", "typecheck"] }

# CI-specific test task - Added for PR #74 CI environment fix
ci-test = "pytest --cov=src/mcp_server_git --cov-report=xml --cov-report=term -v"

# ===== TIER 2: COMPREHENSIVE QUALITY TASKS =====
# Comprehensive Linting (All rules)
lint-all = "ruff check src/ tests/"
lint-all-fix = "ruff check src/ tests/ --fix"

# ===== TIER 2: SECURITY & COMPLIANCE TASKS =====
# Security Scanning
# NOTE: These require quality-extended environment - run with: pixi run -e quality-extended security-scan
security-scan = "bandit -r src/ --severity-level high"
safety-check = "safety check"

# Dead Code Detection
# NOTE: Requires quality-extended environment - run with: pixi run -e quality-extended dead-code
dead-code = "vulture src/ --min-confidence 80 --sort-by-size"
dead-code-strict = "vulture src/ --min-confidence 60 --sort-by-size"

# Static Analysis Suite
static-analysis = { depends-on = ["security-scan", "safety-check"] }

# Pre-commit Integration - with Claude Code git bypass
pre-commit = { depends-on = ["quality"] }

# ===== TIER 3: MAINTENANCE TASKS =====
clean = """
rm -rf __pycache__ .pytest_cache .coverage .mypy_cache .ruff_cache || true
find . -name "*.pyc" -delete || true
find . -name "__pycache__" -type d -exec rm -rf {} + || true
"""
clean-all = { depends-on = ["clean"], cmd = "rm -rf build/ dist/ *.egg-info/ || true" }

# ===== TIER 4: ADVANCED ANALYSIS =====
check-all = { depends-on = ["quality", "static-analysis"] }

# Performance Testing
test-performance = "pytest tests/performance/ -v"
profile = "python -m cProfile -s cumulative -m mcp_server_git"

# Test Coverage Analysis  
test-coverage-report = "pytest --cov=src/mcp_server_git --cov-report=html --cov-report=term"
coverage-threshold = "coverage report --fail-under=85"

# Complex Analysis Tasks
complexity = "python -c \"import ast, sys; [print(f'{f}:{ast.parse(open(f).read()).body}') for f in sys.argv[1:]]\" src/mcp_server_git/*.py"

# ===== APPLICATION TASKS =====
# Server execution
serve = "python -m mcp_server_git"
pixi-git-server = { cmd = "python -m mcp_server_git", env = { PYTHONPATH = "src", CLAUDECODE = "0" } }
pixi-git-server-debug = { cmd = "python -m mcp_server_git -vv --enable-file-logging", env = { PYTHONPATH = "src", LOG_LEVEL = "DEBUG", CLAUDECODE = "0" } }

# Lean interface (3-meta-tool pattern, 95% context reduction)
pixi-git-server-lean = { cmd = "python -m mcp_server_git.lean", env = { PYTHONPATH = "src", CLAUDECODE = "0" } }
pixi-git-server-lean-debug = { cmd = "python -m mcp_server_git.lean -vv --enable-file-logging", env = { PYTHONPATH = "src", LOG_LEVEL = "DEBUG", CLAUDECODE = "0" } }

# Auto-install and run MCP server (for ClaudeCode integration)
mcp-server-git = { cmd = "python -m mcp_server_git", env = { PYTHONPATH = "src", CLAUDECODE = "0" } }

# Production testing
# NOTE: Requires quality environment - run with: pixi run -e quality test-production
test-production = { depends-on = ["install-editable"], cmd = "pytest tests/test_e2e_server.py -v", env = { CLAUDECODE = "0" } }


# ===== LEGACY/SPECIALIZED TASKS =====
# Keep existing specialized tasks - with Claude Code git bypass
# NOTE: These require specific environments - see comments
benchmark = { cmd = "pytest tests/ -m benchmark --benchmark-only --benchmark-sort=mean", env = { CLAUDECODE = "0" } }  # requires dev environment
test-coverage = { cmd = "pytest tests/ --cov=src/mcp_server_git --cov-branch --cov-report=html --cov-report=xml --cov-report=json --cov-report=term-missing", env = { CLAUDECODE = "0" } }  # requires quality-full environment

# Environment-specific test variants
# NOTE: These require quality environment - run with: pixi run -e quality test-quick
test-ci-simulation = { cmd = "pytest tests/ -v --ignore=tests/test_e2e_server.py --tb=short", env = { PYTEST_CI = "true", CI = "true", GITHUB_ACTIONS = "true", CLAUDECODE = "0" } }
test-local-full = { cmd = "pytest tests/ -v --ignore=tests/test_e2e_server.py", env = { CLAUDECODE = "0" } }

# Quick test variants
test-quick = { cmd = "pytest tests/unit/ tests/integration/ -v", env = { CLAUDECODE = "0" } }
test-quick-ci = { cmd = "pytest tests/unit/ tests/integration/ -v", env = { PYTEST_CI = "true", CI = "true", CLAUDECODE = "0" } }

# Git Hooks
githooks = "python scripts/install_hooks.py"
